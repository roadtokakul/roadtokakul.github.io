<style>/* The exam apps' look: Road to Kakul's family — dark, brass and green. */

body{background:radial-gradient(900px 420px at 50% -180px,var(--hero1) 0%,transparent 72%),var(--bg);min-height:100vh}

.plan .pr{font-family:var(--fd);font-size:1.5rem;color:var(--gold2)}.payqr{width:220px;max-width:70%;background:#fff;border-radius:14px;padding:10px;margin:6px auto;display:block}
.steps{text-align:left}.incl li::marker{color:var(--ac)}
label{display:block;font-weight:600;margin:8px 0}.inp{width:100%;margin-top:6px;background:#0a110d;border:1px solid var(--line2);color:var(--fg);border-radius:12px;padding:12px;font:inherit}.inp.big{font-size:1.15rem}.mono{font-family:ui-monospace,monospace}
.oath{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin:12px 0}.oath input{width:20px;height:20px;flex:none;margin-top:2px}
.bn{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;max-width:560px;margin:0 auto;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:rgba(10,15,12,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:6}
.bn button{flex:1;background:none;border:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:.72rem;cursor:pointer}.bn svg{width:22px;height:22px}.bn button.on{color:var(--gold2)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}

const mk = rows => rows.map(([t, q, c, w1, w2, w3, e]) => ({ t, q, o: [c, w1, w2, w3], a: 0, e }));

/* MDCAT Biology — FSc / PMDC curriculum facts. [topic, question, RIGHT, wrong, wrong, wrong, explanation] */
BANK.bio = mk([
  // ---------- Biological Molecules ----------
  ['b_mol', 'About what share of a living cell is water?', '70–90%', '10–20%', '30–40%', '95–99%', 'Water is the most abundant compound in cells, usually 70–90% of their mass.'],

/* Fresh MDCAT calculations: new numbers every time, so a student never runs out and can't memorise answers.
   Each returns { q, o: [correct, three wrong], a: 0, e } — the engine shuffles the options. */
const GEN = (() => {
  const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const fx = (x, d = 2) => { const v = +x.toFixed(d); return String(v); };
  const sup = n => String(n).split('').map(c => '⁰¹²³⁴⁵⁶⁷⁸⁹'[+c]).join('');
  // three wrong answers that differ from the right one and from each other
  function mc(q, right, wrong, unit, e) {
    const u = unit ? ' ' + unit : '', seen = new Set([String(right)]), o = [String(right) + u];
    for (const w of wrong) { const s = String(w); if (!seen.has(s) && o.length < 4) { seen.add(s); o.push(s + u); } }
    const base = parseFloat(String(right).replace('−', '-')); let k = 2;
    while (o.length < 4 && k < 50) { const s = isNaN(base) ? String(right) + ' (' + k + ')' : fx(base * k + 1); if (!seen.has(s)) { seen.add(s); o.push(s + u); } k++; }
    return { q, o, a: 0, e };
  }
  const G = {};
  /* ---------- physics ---------- */
  G.p_vec = () => { const [a, b, c] = pick([[3, 4, 5], [6, 8, 10], [5, 12, 13], [8, 15, 17], [9, 12, 15]]);
    return mc(`Two forces of ${a} N and ${b} N act at right angles on a body. The magnitude of their resultant is:`, c, [a + b, Math.abs(b - a), fx(Math.sqrt(a * b))], 'N', `At 90°, R = √(${a}² + ${b}²) = √${a * a + b * b} = ${c} N.`); };
  G.p_force = () => pick([
    () => { const m = R(2, 12), a = R(2, 9), F = m * a; return mc(`A net force of ${F} N acts on a ${m} kg body. Its acceleration is:`, a, [F * m, fx(m / F), a + 2], 'm/s²', `a = F/m = ${F}/${m} = ${a} m/s².`); },
    () => { const u = R(0, 10), a = R(1, 5), t = R(2, 10), v = u + a * t; return mc(`A car starts at ${u} m/s and accelerates uniformly at ${a} m/s² for ${t} s. Its final velocity is:`, v, [u + a, a * t, v + t], 'm/s', `v = u + at = ${u} + ${a}×${t} = ${v} m/s.`); },
    () => { const a = pick([2, 4, 6]), t = R(2, 8), s = a * t * t / 2; return mc(`A body starts from rest with acceleration ${a} m/s². Distance covered in ${t} s:`, s, [a * t, a * t * t, s / 2], 'm', `s = ½at² = ½×${a}×${t}² = ${s} m.`); },
    () => { const m = R(2, 10), v = R(2, 12), p = m * v; return mc(`Momentum of a ${m} kg body moving at ${v} m/s is:`, p, [fx(m * v * v / 2), m + v, fx(m / v)], 'kg m/s', `p = mv = ${m}×${v} = ${p} kg m/s.`); }])();
  G.p_work = () => pick([
    () => { const m = pick([2, 4, 6, 8, 10]), v = R(2, 10), k = m * v * v / 2; return mc(`Kinetic energy of a ${m} kg body moving at ${v} m/s is:`, k, [m * v, m * v * v, k / 2], 'J', `KE = ½mv² = ½×${m}×${v}² = ${k} J.`); },
    () => { const m = R(2, 10), h = R(2, 20), pe = m * 10 * h; return mc(`A ${m} kg mass is raised ${h} m. Gain in potential energy (g = 10 m/s²):`, pe, [m * h, pe / 2, pe * 2], 'J', `PE = mgh = ${m}×10×${h} = ${pe} J.`); },
    () => { const W = pick([200, 300, 600, 1200, 1500]), t = pick([2, 3, 5, 6]), P = W / t; return mc(`A machine does ${W} J of work in ${t} s. Its power is:`, fx(P), [W * t, fx(P / 2), fx(P + t)], 'W', `P = W/t = ${W}/${t} = ${fx(P)} W.`); },
    () => { const F = R(5, 40), d = R(2, 10), W = F * d; return mc(`A force of ${F} N moves a body ${d} m in its own direction. Work done:`, W, [F + d, fx(F / d), W * 2], 'J', `W = Fd cos0° = ${F}×${d} = ${W} J.`); }])();
  G.p_rot = () => pick([
    () => { const m = R(1, 5), v = pick([2, 4, 6]), r = pick([1, 2, 4]), F = m * v * v / r; return mc(`A ${m} kg body moves in a circle of radius ${r} m at ${v} m/s. Centripetal force:`, fx(F), [fx(m * v / r), fx(m * v * v), fx(F / 2)], 'N', `F = mv²/r = ${m}×${v}²/${r} = ${fx(F)} N.`); },
    () => { const v = pick([4, 6, 8, 10, 12]), r = pick([2, 4, 5]), w = v / r; return mc(`A point on a wheel of radius ${r} m moves at ${v} m/s. Its angular velocity is:`, fx(w), [v * r, fx(w * 2), fx(r / v)], 'rad/s', `ω = v/r = ${v}/${r} = ${fx(w)} rad/s.`); }])();
  G.p_fluid = () => { const A1 = pick([2, 4, 6, 8]), v1 = R(1, 6), A2 = pick([1, 2]), v2 = A1 * v1 / A2;
    return mc(`Water flows at ${v1} m/s through a pipe of area ${A1} cm². In a narrower part of area ${A2} cm², its speed is:`, fx(v2), [fx(v1 * A2 / A1), v1, fx(v2 * 2)], 'm/s', `Continuity: A₁v₁ = A₂v₂, so v₂ = ${A1}×${v1}/${A2} = ${fx(v2)} m/s.`); };
  G.p_wave = () => pick([
    () => { const f = pick([50, 100, 200, 250, 500]), l = pick([0.5, 1, 2, 4]), v = f * l; return mc(`A wave of frequency ${f} Hz has wavelength ${l} m. Its speed is:`, fx(v), [fx(f / l), fx(l / f), fx(v / 2)], 'm/s', `v = fλ = ${f}×${l} = ${fx(v)} m/s.`); },
    () => { const T = pick([0.01, 0.02, 0.05, 0.1, 0.25]), f = 1 / T; return mc(`A wave has a time period of ${T} s. Its frequency is:`, fx(f), [fx(T), fx(f * 2), fx(f / 2)], 'Hz', `f = 1/T = 1/${T} = ${fx(f)} Hz.`); }])();
  G.p_thermo = () => { const Th = pick([400, 500, 600, 800]), Tc = pick([200, 300]), e = 100 * (1 - Tc / Th);
    return mc(`A Carnot engine works between ${Th} K and ${Tc} K. Its efficiency is:`, fx(e, 1), [fx(100 * Tc / Th, 1), fx(e / 2, 1), fx(100 * (Th - Tc) / (Th + Tc), 1)], '%', `η = 1 − T꜀/Tₕ = 1 − ${Tc}/${Th} = ${fx(e, 1)}%.`); };
  G.p_estat = () => { const C = pick([2, 4, 5, 10, 20]), V = pick([6, 10, 12, 50, 100]), Q = C * V;
    return mc(`A ${C} μF capacitor is connected to ${V} V. The charge on it is:`, Q, [fx(C / V), fx(V / C), Q * 2], 'μC', `Q = CV = ${C} μF × ${V} V = ${Q} μC.`); };
  G.p_curr = () => pick([
    () => { const I = R(1, 6), Rr = R(2, 12), V = I * Rr; return mc(`A current of ${I} A flows through a ${Rr} Ω resistor. Potential difference across it:`, V, [fx(Rr / I), I + Rr, V * 2], 'V', `V = IR = ${I}×${Rr} = ${V} V.`); },
    () => { const a = R(2, 12), b = R(2, 12); return mc(`Resistors of ${a} Ω and ${b} Ω are joined in series. Equivalent resistance:`, a + b, [fx(a * b / (a + b)), a * b, Math.abs(a - b) || a + b + 1], 'Ω', `In series, R = R₁ + R₂ = ${a} + ${b} = ${a + b} Ω.`); },
    () => { const [a, b] = pick([[6, 3], [12, 6], [4, 4], [10, 10], [12, 4], [20, 5]]), p = a * b / (a + b); return mc(`Resistors of ${a} Ω and ${b} Ω are joined in parallel. Equivalent resistance:`, fx(p), [a + b, fx(p * 2), fx((a + b) / 2 + 1)], 'Ω', `In parallel, R = R₁R₂/(R₁ + R₂) = ${a * b}/${a + b} = ${fx(p)} Ω.`); },
    () => { const V = pick([6, 12, 24, 220]), I = pick([2, 3, 5]), P = V * I; return mc(`A device draws ${I} A from a ${V} V supply. Its power is:`, P, [fx(V / I), V + I, P * 2], 'W', `P = VI = ${V}×${I} = ${P} W.`); }])();
  G.p_emi = () => { const B = pick([0.2, 0.5, 1, 2]), L = pick([0.5, 1, 2]), v = pick([2, 4, 5, 10]), e = B * L * v;
    return mc(`A ${L} m rod moves at ${v} m/s at right angles to a ${B} T magnetic field. The induced emf is:`, fx(e), [fx(B * v), fx(e * 2), fx(B * L / v)], 'V', `ε = BLv = ${B}×${L}×${v} = ${fx(e)} V.`); };
  G.p_ac = () => { const V0 = pick([10, 20, 100, 141.4, 311]), r = V0 / Math.SQRT2;
    return mc(`The peak value of an alternating voltage is ${V0} V. Its rms value is about:`, fx(r, 1), [fx(V0 * Math.SQRT2, 1), fx(V0 / 2, 1), fx(V0, 1)], 'V', `V(rms) = V₀/√2 = ${V0}/1.414 ≈ ${fx(r, 1)} V.`); };
  G.p_modern = () => { const l = pick([248, 310, 413, 496, 620]), E = 1240 / l;
    return mc(`Energy of a photon of wavelength ${l} nm (use hc = 1240 eV·nm):`, fx(E, 1), [fx(l / 1240, 2), fx(E * 2, 1), fx(E / 2, 1)], 'eV', `E = hc/λ = 1240/${l} = ${fx(E, 1)} eV.`); };
  G.p_nuc = () => { const T = pick([2, 3, 5, 8, 10]), n = R(1, 4), m0 = pick([16, 32, 64, 80, 160]), left = m0 / 2 ** n;
    return mc(`A radioactive sample of ${m0} g has a half-life of ${T} days. Mass left after ${n * T} days:`, fx(left), [fx(m0 / (n + 1)), fx(left * 2), fx(m0 - m0 / 2 ** n)], 'g', `${n * T} days is ${n} half-lives: ${m0} × (½)^${n} = ${fx(left)} g.`); };

    () => { const [f, mm] = pick(M), n = pick([0.5, 1, 2, 3, 0.25]), g = mm * n; return mc(`How many moles are there in ${fx(g)} g of ${f}? (molar mass ${mm} g/mol)`, fx(n), [fx(g * mm), fx(n * 2), fx(mm / g)], 'mol', `n = mass/molar mass = ${fx(g)}/${mm} = ${fx(n)} mol.`); },
    () => { const n = pick([0.5, 1, 2, 3]), N = n * 6.02; return mc(`Number of molecules in ${n} mol of a gas:`, fx(N) + ' × 10²³', [fx(N * 10) + ' × 10²³', fx(n) + ' × 10²³', fx(6.02 / n) + ' × 10²³'], '', `N = n × Nₐ = ${n} × 6.02 × 10²³ = ${fx(N)} × 10²³.`); },
    () => { const [f, mm] = pick(M); return mc(`Mass of 1 mole of ${f} is:`, mm, [mm * 2, fx(mm / 2), mm + 16], 'g', `One mole of a substance has a mass equal to its molar mass: ${mm} g.`); }])();
  G.c_gas = () => pick([
    () => { const P1 = pick([1, 2, 3, 4]), V1 = pick([2, 4, 6, 12]), P2 = pick([2, 4, 6, 8].filter(x => x !== P1)), V2 = P1 * V1 / P2; return mc(`At constant temperature, a gas occupies ${V1} dm³ at ${P1} atm. Its volume at ${P2} atm is:`, fx(V2), [fx(V1 * P2 / P1), fx(V2 * 2), fx(V1 + P2 - P1)], 'dm³', `Boyle's law: P₁V₁ = P₂V₂, so V₂ = ${P1}×${V1}/${P2} = ${fx(V2)} dm³.`); },
    () => { const T1 = pick([200, 300, 400]), V1 = pick([2, 3, 5, 6]), T2 = pick([400, 600, 800].filter(x => x !== T1)), V2 = V1 * T2 / T1; return mc(`At constant pressure, ${V1} dm³ of a gas at ${T1} K is heated to ${T2} K. New volume:`, fx(V2), [fx(V1 * T1 / T2), fx(V2 + 1), fx(V1 + (T2 - T1) / 100)], 'dm³', `Charles's law: V₁/T₁ = V₂/T₂, so V₂ = ${V1}×${T2}/${T1} = ${fx(V2)} dm³.`); },
    () => { const c = R(-73, 127), k = c + 273; return mc(`${c} °C on the Kelvin scale is:`, k, [k + 100, k - 100, 273 - c === k ? k + 10 : 273 - c], 'K', `T(K) = t(°C) + 273 = ${c} + 273 = ${k} K.`); }])();
  G.c_eq = () => pick([
    () => { const n = R(1, 6); return mc(`A strong acid solution has [H⁺] = 10⁻${sup(n)} mol/dm³. Its pH is:`, n, [14 - n, n + 1, n === 1 ? 0.1 : n - 1], '', `pH = −log[H⁺] = −log 10⁻${sup(n)} = ${n}.`); },
    () => { const p = R(1, 13); return mc(`An aqueous solution at 25 °C has pH ${p}. Its pOH is:`, 14 - p, [p, 15 - p, Math.max(0, 13 - p)], '', `pH + pOH = 14, so pOH = 14 − ${p} = ${14 - p}.`); }])();
  G.c_kin = () => { const t = pick([10, 20, 30]), n = R(1, 3), c0 = pick([0.8, 1.6, 2.4, 3.2]);
    return mc(`A first-order reaction has a half-life of ${t} min. Starting at ${c0} M, the concentration after ${n * t} min is:`, fx(c0 / 2 ** n, 3), [fx(c0 / (2 * n), 3), fx(c0 / 2 ** (n + 1), 3), fx(c0 - c0 / 2 ** n, 3)], 'M', `${n * t} min is ${n} half-life(s): ${c0} × (½)^${n} = ${fx(c0 / 2 ** n, 3)} M.`); };
  G.c_atom = () => { const [sym, Z, A] = pick([['Na', 11, 23], ['Cl', 17, 35], ['K', 19, 39], ['Ca', 20, 40], ['Fe', 26, 56], ['Al', 13, 27], ['P', 15, 31], ['S', 16, 32]]);
    return pick([() => mc(`An atom of ${sym} has mass number ${A} and atomic number ${Z}. Number of neutrons:`, A - Z, [A, Z, A + Z], '', `Neutrons = A − Z = ${A} − ${Z} = ${A - Z}.`),
      () => mc(`Number of electrons in a neutral atom of ${sym} (atomic number ${Z}, mass number ${A}):`, Z, [A - Z, A, Z + 1], '', `A neutral atom has as many electrons as protons: ${Z}.`)])(); };
  /* ---------- logical reasoning ---------- */

    () => { const a = R(2, 20), d = R(3, 9), s = [0, 1, 2, 3, 4].map(i => a + i * d); return mc(`Find the next number: ${s.join(', ')}, ?`, a + 5 * d, [a + 5 * d + 1, a + 5 * d - 1, a + 6 * d], '', `Each term adds ${d}: ${s[4]} + ${d} = ${a + 5 * d}.`); },
    () => { const a = R(1, 4), r = pick([2, 3]), s = [0, 1, 2, 3].map(i => a * r ** i); return mc(`Find the next number: ${s.join(', ')}, ?`, a * r ** 4, [a * r ** 4 + r, s[3] + s[2], a * r ** 3 * (r + 1)], '', `Each term is multiplied by ${r}: ${s[3]} × ${r} = ${a * r ** 4}.`); },
    () => { const a = R(1, 10), s = [a]; for (let i = 1; i < 5; i++) s.push(s[i - 1] + i * 2); const nx = s[4] + 10; return mc(`Find the next number: ${s.join(', ')}, ?`, nx, [nx - 2, nx + 2, s[4] + 8 + 4], '', `The differences go 2, 4, 6, 8, so the next is +10: ${s[4]} + 10 = ${nx}.`); },
    () => { const L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', st = R(0, 8), k = R(2, 4), s = [0, 1, 2, 3].map(i => L[st + i * k]); const nx = L[st + 4 * k]; return mc(`Find the next letter: ${s.join(', ')}, ?`, nx, [L[st + 4 * k + 1], L[st + 4 * k - 1], L[st + 3 * k + 1]], '', `Each letter skips ahead by ${k}: ${s[3]} → ${nx}.`); },
    () => { const L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', st = R(0, 15), s = [0, 1, 2].map(i => L[st + i] + L[25 - st - i]); const nx = L[st + 3] + L[22 - st]; return mc(`Find the next pair: ${s.join(', ')}, ?`, nx, [L[st + 3] + L[23 - st], L[st + 4] + L[22 - st], L[22 - st] + L[st + 3]], '', `The first letter moves forward from ${L[st]}, the second backward from ${L[25 - st]} (opposite letters): ${nx}.`); }])();

    () => { const N = R(20, 45), k = R(3, N - 3); return mc(`In a row of ${N} students, Ali is ${k}th from the left. What is his position from the right?`, N - k + 1, [N - k, N - k + 2, k + 1], '', `Position from right = total − left position + 1 = ${N} − ${k} + 1 = ${N - k + 1}.`); },
    () => { const a = R(8, 15), d = R(3, 8); return mc(`Sara is ${d} years older than her brother. Their ages add up to ${2 * a + d}. How old is the brother?`, a, [a + d, a - 1, a + 1], 'years', `b + (b + ${d}) = ${2 * a + d}, so 2b = ${2 * a}, b = ${a}.`); },
    () => { const w = pick(['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday']), W = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'], n = R(8, 30), t = W[(W.indexOf(w) + n) % 7]; return mc(`If today is ${w}, what day will it be after ${n} days?`, t, W.filter(x => x !== t).sort(() => Math.random() - .5).slice(0, 3), '', `${n} = ${Math.floor(n / 7)} weeks + ${n % 7} days; ${w} + ${n % 7} days = ${t}.`); }])();
  return G;
})();

'use strict';
/* =====================================================================
   The exam engine (28 Nov 2026) — Road to MBBS first, Road to CSS next, from the same file.
   The exam comes from EXAM (apps/<name>/config.js), its questions from BANK (bank/*.js) and fresh ones from GEN
   (gen.js). Practice by subject and topic, mocks in the real format, mistakes, progress, passes (Easypaisa, the
   same Google Form and backend as Road to Kakul), a free Pro day for new phones.
   ===================================================================== */
const $id = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KEY = EXAM.key + '_state_v1', CFG_KEY = EXAM.key + '_cfg_v1';
const pkDay = (t = Date.now()) => new Date(t + 5 * 3600e3).toISOString().slice(0, 10);   // Pakistan's date
const today = () => pkDay();
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const genId = () => Array.from({ length: 8 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[rnd(32)]).join('');
const pct = (c, n) => n ? Math.round(100 * c / n) : 0;
const SUBJ = Object.fromEntries(EXAM.subjects.map(s => [s.id, s]));
const TOPIC = {}; EXAM.subjects.forEach(s => s.topics.forEach(([id, n]) => { TOPIC[id] = { id, n, s: s.id }; }));

/* ---------- state ---------- */
function defState() {
  return { v: 1, created: Date.now(), dev: genId(), onboard: false, name: '', testDate: '', stats: {}, seen: {}, mist: [], mocks: [],
    days: {}, xp: 0, pay: null, payHist: [], payPlan: '', trial: null, trk: null, diag: null, freeMini: 0 };
}
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v) return Object.assign(defState(), s); } catch (e) { } return defState(); }
let S = load(), saveT = 0;
function save() { clearTimeout(saveT); saveT = setTimeout(saveNow, 120); }
function saveNow() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
window.addEventListener('pagehide', saveNow);

/* ---------- remote config: Road to Kakul's pack.json (the same form, block list and backend) ---------- */
let CFG = (() => { try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; } catch (e) { return {}; } })();
function loadCfg() {
  return fetch(EXAM.packUrl + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(p => {
    CFG = (p && p.config) || {}; try { localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); } catch (e) { }
    if (payActive() === false && S.pay && (CFG.blockTids || []).includes(S.pay.tid)) render();
  }).catch(() => { });
}
const PAY = () => Object.assign({ tidMin: 10, tidMax: 20 }, CFG.pay || {});
const apiOn = () => !!(CFG.api && /^https:\/\//.test(CFG.api));
function apiCall(path, body) {
  const o = body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {};
  return fetch(CFG.api.replace(/\/+$/, '') + path, o).then(r => r.json());
}
function formLog(o) {
  const P = PAY(); if (!P.logUrl) return;
  try {
    const f = new URLSearchParams(), map = P.logMap || {}, mapped = Object.keys(map).length > 0;
    const data = Object.assign({ kind: '', plan: '', tid: '', id: S.dev, name: S.name || '', course: EXAM.key, at: new Date().toISOString(), note: '' }, o);
    Object.keys(data).forEach(k => { if (mapped && !map[k]) return; f.append(map[k] || k, String(data[k])); });
    fetch(P.logUrl, { method: 'POST', mode: 'no-cors', body: f }).catch(() => { });
  } catch (e) { }
}
function howOpened() {
  const ua = navigator.userAgent || '';
  if (/Instagram|FBAN|FBAV|FB_IAB|FBIOS|Messenger/i.test(ua)) return 'insta-fb';
  return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone ? 'installed' : 'browser';
}
// anonymous usage counts, once a day per phone and kind: "<exam>_<event>" in the form's kind "event"
function track(ev, note) {
  try {
    if (CFG.track !== true) return;
    const t = S.trk && S.trk.d === today() ? S.trk : (S.trk = { d: today(), e: {} });
    if (t.e[ev]) return; t.e[ev] = 1; save();
    formLog({ kind: 'event', plan: EXAM.key + '_' + ev, note: note || howOpened(), name: '' });
  } catch (e) { }
}

/* ---------- access: Free, the free Pro day, a pass ---------- */
const TRIAL_H = () => EXAM.trialHours == null ? 24 : EXAM.trialHours;
const trialLeft = () => S.trial && S.trial.until > Date.now() ? S.trial.until - Date.now() : 0;
function payActive() { const p = S.pay; if (!p || !p.tid) return false; if ((CFG.blockTids || []).includes(p.tid) || p.off) return false; return p.until === 0 || p.until > Date.now(); }
const isPro = () => payActive() || trialLeft() > 0;
const freeLeftToday = () => Math.max(0, EXAM.freeDaily - ((S.days[today()] || {}).q || 0));
const hoursLeft = ms => Math.max(1, Math.ceil(ms / 3600e3));

/* ---------- questions ---------- */
let QID = 0;
const GENS = typeof GEN !== 'undefined' ? GEN : {};
const ALL = [];
Object.keys(BANK).forEach(s => BANK[s].forEach((x, i) => { if (TOPIC[x.t]) ALL.push(Object.assign({ id: s + ':' + i, s }, x)); else console.warn('no topic', x.t); }));
const byTopic = {}; ALL.forEach(q => (byTopic[q.t] = byTopic[q.t] || []).push(q));
function fresh(t, n) {           // generated questions for a topic (numbers change every time)
  const g = GENS[t]; if (!g) return [];
  const out = []; for (let i = 0; i < n; i++) { try { const q = g(); out.push(Object.assign({ id: 'g:' + t + ':' + (++QID) + ':' + Date.now(), t, s: TOPIC[t].s, gen: 1 }, q)); } catch (e) { console.error(e); } }
  return out;
}
const hasQ = t => (byTopic[t] || []).length > 0 || !!GENS[t];
// pick n questions from a topic: unseen first, then the longest ago; generated ones mixed in
function pickTopic(t, n) {
  const bank = (byTopic[t] || []).slice().sort((a, b) => (S.seen[a.id] || 0) - (S.seen[b.id] || 0) || Math.random() - .5);
  const g = fresh(t, GENS[t] ? Math.min(n, Math.max(Math.ceil(n / 2), n - (byTopic[t] || []).length)) : 0);
  return shuffle(bank.slice(0, Math.max(0, n - g.length)).concat(g)).slice(0, n);
}
// pick n questions for a subject, spread over its topics
function pickSubject(s, n) {
  const ts = SUBJ[s].topics.map(x => x[0]).filter(hasQ); if (!ts.length) return [];
  const out = [], per = {}; for (let i = 0; i < n; i++) { const t = ts[i % ts.length]; per[t] = (per[t] || 0) + 1; }
  shuffle(Object.keys(per)).forEach(t => { out.push(...pickTopic(t, per[t])); });
  while (out.length < n) { const t = ts[rnd(ts.length)]; const extra = pickTopic(t, 1).filter(q => !out.some(o => o.id === q.id)); if (!extra.length) break; out.push(extra[0]); }
  return shuffle(out).slice(0, n);
}
// a paper with the real split (EXAM.format: [[subject, count]...])
function paper(scale) {          // exactly round(total × scale) questions, split like the real paper (largest remainders)
  const want = Math.max(EXAM.format.length, Math.round(EXAM.total * scale));
  const raw = EXAM.format.map(([s, n]) => ({ s, x: n * want / EXAM.total }));
  raw.forEach(r => { r.k = Math.max(1, Math.floor(r.x)); });
  let left = want - raw.reduce((a, r) => a + r.k, 0);
  raw.slice().sort((a, b) => (b.x - Math.floor(b.x)) - (a.x - Math.floor(a.x))).forEach(r => { if (left > 0) { r.k++; left--; } });
  return raw.flatMap(r => pickSubject(r.s, r.k));
}
// options shuffled for each sitting; the answer follows
function present(q) { const ord = shuffle(q.o.map((_, i) => i)); return Object.assign({}, q, { o: ord.map(i => q.o[i]), a: ord.indexOf(q.a) }); }

/* ---------- views ---------- */
const V = {}, ACT = {};
let stack = [['home', {}]];
const cur = () => stack[stack.length - 1];
function go(v, p) { stack.push([v, p || {}]); render(); window.scrollTo(0, 0); }
function tab(v) { stack = [[v, {}]]; render(); window.scrollTo(0, 0); }
function back() { if (stack.length > 1) stack.pop(); else stack = [['home', {}]]; render(); }
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.innerHTML = t; document.body.appendChild(d); setTimeout(() => d.classList.add('out'), 2200); setTimeout(() => d.remove(), 2700); }
function modal(html) { closeModal(); const m = document.createElement('div'); m.className = 'modal'; m.id = 'modal'; m.innerHTML = '<div class="sheet">' + html + '</div>'; m.addEventListener('click', e => { if (e.target === m) closeModal(); }); document.body.appendChild(m); }
function closeModal() { const m = $id('modal'); if (m) m.remove(); }
const bar = (p, cls) => '<div class="bar ' + (cls || '') + '"><i style="width:' + Math.max(0, Math.min(100, p)) + '%"></i></div>';
const chip = () => isPro() ? '<span class="chip pro" data-go="passes">★ PRO' + (!payActive() ? ' · ' + hoursLeft(trialLeft()) + 'h' : '') + '</span>' : '<span class="chip" data-go="passes">FREE</span>';
const NAV = [['home', 'Home', 'M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z'], ['practice', 'Practice', 'M4 5h16M4 12h16M4 19h10'],
  ['mocks', 'Mocks', 'M12 7v5l3 2M12 3a9 9 0 100 18 9 9 0 000-18z'], ['progress', 'Progress', 'M4 20V10M10 20V4M16 20v-7M22 20H2'], ['passes', 'Passes', 'M12 2l3 6.5 7 1-5 5 1.2 7L12 18l-6.2 3.5L7 14.5l-5-5 7-1z']];
const ico = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"/></svg>';

function render() {
  closeModal(); clearInterval(render.tick);
  if (!S.onboard) { draw(V.welcome()); return; }
  const [v, p] = cur(); const r = (V[v] || V.home)(p || {});
  draw(r);
}
function draw(r) {
  const app = $id('app');
  const head = r.noHead ? '' : '<header><div class="hl">' + (stack.length > 1 ? '<button class="ib" data-act="back" aria-label="Back">' + ico('M15 18l-6-6 6-6') + '</button>' : '<span class="logo">' + EXAM.logo + '</span>') +
    '<b class="ttl">' + esc(r.title || EXAM.name) + '</b></div><div class="hr">' + (S.streak ? '<span class="chip">🔥 ' + streak() + '</span>' : '') + chip() + '</div></header>';
  const nav = r.noNav ? '' : '<nav class="bn">' + NAV.map(([k, n, d]) => '<button class="' + ((r.tab || cur()[0]) === k ? 'on' : '') + '" data-tab="' + k + '">' + ico(d) + '<span>' + n + '</span></button>').join('') + '</nav>';
  app.className = r.noNav ? 'nonav' : '';
  app.innerHTML = head + '<main class="enter">' + r.html + '</main>' + nav;
  if (r.after) try { r.after(); } catch (e) { console.error(e); }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-go],[data-tab]'); if (!t) return;
  if (t.tagName === 'A') e.preventDefault();
  if (t.dataset.tab) return tab(t.dataset.tab);
  if (t.dataset.go) return go(t.dataset.go, t.dataset.arg ? { k: t.dataset.arg } : {});
  const f = ACT[t.dataset.act]; if (f) f(t.dataset.arg, t);
});
ACT.back = back; ACT.close = closeModal;

/* ---------- progress numbers ---------- */
function addDay(q, c) { const d = S.days[today()] = S.days[today()] || { q: 0, c: 0 }; d.q += q; d.c += c; }
function streak() { let n = 0; for (let k = 0; k < 400; k++) { const d = pkDay(Date.now() - k * 864e5); if ((S.days[d] || {}).q) n++; else if (k > 0) break; } return n; }
function subjStat(s) { let n = 0, c = 0; SUBJ[s].topics.forEach(([t]) => { const x = S.stats[t]; if (x) { n += x.n; c += x.c; } }); return { n, c }; }
function totalQ() { return Object.values(S.stats).reduce((a, x) => a + x.n, 0); }
// readiness: accuracy weighted by each subject's share of the paper, scaled by how much of the syllabus has been practised
function readiness() {
  let acc = 0, cov = 0, w = 0;
  EXAM.format.forEach(([s, n]) => { const st = subjStat(s); const ts = SUBJ[s].topics.filter(([t]) => (S.stats[t] || {}).n >= 5).length;
    acc += n * (st.n ? st.c / st.n : 0); cov += n * ts / SUBJ[s].topics.length; w += n; });
  return Math.round(100 * (acc / w) * Math.min(1, 0.35 + 0.65 * cov / w));
}
const estScore = () => Math.round(EXAM.total * readiness() / 100);
function weakTopics(k) {
  return Object.keys(S.stats).filter(t => TOPIC[t] && S.stats[t].n >= 4).sort((a, b) => S.stats[a].c / S.stats[a].n - S.stats[b].c / S.stats[b].n).slice(0, k);
}
const daysTo = () => { if (!S.testDate) return null; return Math.ceil((Date.parse(S.testDate + 'T09:00:00+05:00') - Date.now()) / 864e5); };

/* ---------- welcome: one tap ---------- */
V.welcome = () => {
  track('ob_view');
  return { noHead: true, noNav: true, html: '<div class="welcome"><div class="wl">' + EXAM.logo + '</div><h1>' + esc(EXAM.name) + '</h1><p class="tag">' + esc(EXAM.tagline) + '</p>' +
    '<p class="hook">' + esc(EXAM.hook) + '</p>' + (TRIAL_H() ? '<p class="trialnote">★ <b>Your first day is Pro, free.</b></p>' : '') +
    '<div class="card feats">' + EXAM.format.map(([s, n]) => '<div><span class="dot" style="background:' + SUBJ[s].c + '"></span><b>' + esc(SUBJ[s].n) + '</b><small>' + n + ' MCQs in the paper</small></div>').join('') + '</div>' +
    '<button class="btn gold big" data-act="start">Start practising free →</button>' +
    '<p class="fine">' + esc(EXAM.disclaimer) + '</p></div>' };
};
ACT.start = () => {
  const first = !S.onboard; S.onboard = true; S.name = S.name || 'Doctor-to-be';
  if (first) { track('ob_start'); track('first'); if (TRIAL_H() && !S.trial) S.trial = { at: Date.now(), until: Date.now() + TRIAL_H() * 3600e3, q: totalQ() }; }
  save(); stack = [['home', {}]]; render();

function gate(n) {             // free users: EXAM.freeDaily practice questions a day

  const ts = shuffle(weak.concat(shuffle(untried).slice(0, 6))).slice(0, 5);

  startQuiz({ title: 'Smart practice', items, mode: 'practice' });
};
ACT.mistakes = () => { const ids = S.mist.slice(-20); const items = ids.map(x => typeof x === 'string' ? ALL.find(q => q.id === x) : x).filter(Boolean); if (!items.length) { toast('No mistakes saved'); return; } startQuiz({ title: 'Your mistakes', items: shuffle(items).slice(0, 10), mode: 'practice', review: 1 }); };

/* ---------- the quiz ---------- */
let Q = null;
function startQuiz(o) {
  if (!o.items.length) { toast('No questions here yet'); return; }
  Q = Object.assign({ i: 0, picks: [], start: Date.now() }, o, { items: o.items.map(present) });
  if (Q.mode !== 'practice') track(Q.mode);
  go('quiz');
}
function record(q, ok) {
  const st = S.stats[q.t] = S.stats[q.t] || { n: 0, c: 0 }; st.n++; if (ok) st.c++;
  S.seen[q.id] = Date.now(); addDay(1, ok ? 1 : 0); S.xp += ok ? 2 : 1;
  const key = q.gen ? null : q.id;
  if (!ok) { if (key) { if (!S.mist.includes(key)) S.mist.push(key); } else S.mist.push({ t: q.t, s: q.s, q: q.q, o: q.o, a: q.a, e: q.e, id: q.id, gen: 1 }); }
  else S.mist = S.mist.filter(x => (typeof x === 'string' ? x : x.id) !== q.id);
  if (S.mist.length > 300) S.mist = S.mist.slice(-300);
  const ks = Object.keys(S.seen); if (ks.length > 4000) ks.sort((a, b) => S.seen[a] - S.seen[b]).slice(0, 1000).forEach(k => delete S.seen[k]);
}
V.quiz = () => {
  if (!Q) return V.home();
  const q = Q.items[Q.i], n = Q.items.length, picked = Q.picks[Q.i], mock = Q.mode !== 'practice';
  const shown = !mock && picked != null;
  const opts = q.o.map((o, i) => '<button class="opt' + (shown ? (i === q.a ? ' ok' : i === picked ? ' bad' : '') : (picked === i ? ' sel' : '')) + '" data-act="pick" data-arg="' + i + '"' + (shown ? ' disabled' : '') + '><i>' + 'ABCD'[i] + '</i><span>' + esc(o) + '</span></button>').join('');
  const timer = mock ? '<span class="timer" id="qtimer"></span>' : '';
  const foot = shown ? '<div class="expl ' + (picked === q.a ? 'ok' : 'bad') + '"><b>' + (picked === q.a ? 'Correct' : 'The answer is ' + 'ABCD'[q.a]) + '</b>' + (q.e ? '<p>' + esc(q.e) + '</p>' : '') + '</div><button class="btn gold big" data-act="next">' + (Q.i + 1 < n ? 'Next' : 'Finish') + '</button>'
    : mock ? '<div class="row g"><button class="btn" data-act="prev"' + (Q.i ? '' : ' disabled') + '>‹ Back</button><button class="btn gold wide" data-act="next">' + (Q.i + 1 < n ? 'Next ›' : 'Review & submit') + '</button></div><button class="btn ghost sm" data-act="grid">All questions</button>' : '';
  return { title: Q.title, noNav: true, html: '<div class="qhead"><small>' + esc(SUBJ[q.s].n) + ' · ' + esc(TOPIC[q.t].n) + '</small><small>' + (Q.i + 1) + ' / ' + n + '</small>' + timer + '</div>' + bar(100 * (Q.i + (shown ? 1 : 0)) / n, 'thin') +
    '<div class="qcard"><p class="q">' + esc(q.q) + '</p>' + opts + '</div>' + foot,
    after() { if (mock) tickTimer(); } };
};
function tickTimer() {
  const el = $id('qtimer'); if (!el || !Q.limit) return;
  const f = () => { const left = Math.max(0, Q.limit * 1000 - (Date.now() - Q.start)); const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60; el.textContent = m + ':' + String(s).padStart(2, '0'); el.classList.toggle('low', left < 300000); if (!left) finishQuiz(); };
  f(); render.tick = setInterval(f, 1000);
}
ACT.pick = i => {
  i = +i; const q = Q.items[Q.i];
  if (Q.mode === 'practice') { if (Q.picks[Q.i] != null) return; Q.picks[Q.i] = i; record(q, i === q.a); save(); }
  else Q.picks[Q.i] = i;
  render();
};
ACT.next = () => { if (Q.mode === 'practice' && Q.picks[Q.i] == null) return; if (Q.i + 1 < Q.items.length) { Q.i++; render(); window.scrollTo(0, 0); } else if (Q.mode === 'practice') finishQuiz(); else ACT.grid(); };
ACT.prev = () => { if (Q.i) { Q.i--; render(); } };
ACT.grid = () => {
  const a = Q.picks.filter(x => x != null).length;

};
ACT.jump = i => { Q.i = +i; closeModal(); render(); };
ACT.submit = () => { closeModal(); finishQuiz(); };
function finishQuiz() {
  if (!Q || Q.done) return; Q.done = 1; clearInterval(render.tick);
  const mock = Q.mode !== 'practice';
  if (mock) Q.items.forEach((q, i) => record(q, Q.picks[i] === q.a));
  const c = Q.items.filter((q, i) => Q.picks[i] === q.a).length, n = Q.items.length;
  const per = {}; Q.items.forEach((q, i) => { const p = per[q.s] = per[q.s] || { n: 0, c: 0 }; p.n++; if (Q.picks[i] === q.a) p.c++; });
  Q.res = { c, n, per, secs: Math.round((Date.now() - Q.start) / 1000) };
  if (Q.mode === 'mock' || Q.mode === 'mini') { S.mocks.unshift({ d: today(), kind: Q.mode, sc: c, n, per }); S.mocks = S.mocks.slice(0, 30); }
  if (Q.mode === 'diag') { S.diag = { d: today(), c, n, est: Math.round(EXAM.total * c / n), per }; track('diag_done', String(S.diag.est)); }
  save(); stack[stack.length - 1] = ['result', {}]; render(); window.scrollTo(0, 0);
}
V.result = () => {

};

};
ACT.plan = id => { S.payPlan = id; save(); render(); };
ACT.family = () => { const P = EXAM.plans.find(p => p.id === S.payPlan) || EXAM.plans[0]; const t = 'Assalam o Alaikum! I am preparing for ' + EXAM.short + ' with ' + EXAM.name + ' (' + EXAM.url + '). Please help me with the ' + P.n + ': Rs ' + P.p + '. Open the link, tap Passes, scan the QR in Easypaisa, then send me the Transaction ID. 🙏'; location.href = 'https://wa.me/?text=' + encodeURIComponent(t); };
ACT.unlock = () => {
  const P = PAY(), plan = EXAM.plans.find(p => p.id === S.payPlan) || EXAM.plans[0];
  const tid = ($id('pay_tid').value || '').replace(/\D/g, '');
  if (tid.length < P.tidMin || tid.length > P.tidMax) { toast('Type the Transaction ID from the Easypaisa receipt'); return; }
  if (!$id('pay_oath').checked) { toast('Tick the box to confirm you paid'); return; }
  if ((CFG.blockTids || []).includes(tid)) { modal('<h3>Not unlocked</h3><p>This Transaction ID cannot be used.</p><button class="btn big" data-act="close">OK</button>'); return; }
  const before = S.pay;
  const base = payActive() && S.pay.until ? S.pay.until : Date.now();
  S.pay = { plan: plan.id, tid, at: Date.now(), until: plan.d ? base + plan.d * 864e5 : 0 };
  S.payHist.push({ plan: plan.id, tid, at: Date.now() }); save();
  formLog({ kind: 'pay', plan: EXAM.short + ' ' + plan.n + ' Rs ' + plan.p, tid, note: EXAM.name });
  track('paid', plan.id);
  if (apiOn()) apiCall('/pass/claim', { tid, plan: EXAM.key + '_' + plan.id, rs: plan.p, dev: S.dev, name: S.name || '', course: EXAM.key }).then(r => {
    if (r && r.ok === false && ['full', 'declined', 'blocked'].includes(r.status)) {
      S.pay = before; S.payHist.pop(); save(); render();
      modal('<h3>Not unlocked</h3><p>' + ({ full: 'This Transaction ID is already in use on two phones.', declined: 'This Transaction ID was not found in our Easypaisa account.', blocked: 'This Transaction ID cannot be used.' }[r.status]) + '</p><button class="btn big" data-act="close">OK</button>');
    }
  }).catch(() => { });
  tab('home'); setTimeout(() => modal('<h3>★ Unlocked: ' + esc(plan.n) + '</h3><p>Unlimited practice and full mocks are open. Make every day count.</p><button class="btn gold big" data-act="close">Start</button>'), 300);
};
// a declined or blocked ID is switched off within the hour
function passCheck() {
  if (!apiOn() || !S.pay || !S.pay.tid || S.pay.off) return;
  if (S.passChk && Date.now() - S.passChk < 3600e3) return; S.passChk = Date.now(); save();
  apiCall('/pass/check?tid=' + encodeURIComponent(S.pay.tid) + '&dev=' + encodeURIComponent(S.dev)).then(o => {
    if (o && (o.pass === 'declined' || o.pass === 'blocked')) { S.pay.off = 1; save(); render(); toast('Your Transaction ID was not found — the pass is off'); }
  }).catch(() => { });
}

/* ---------- the free Pro day ends: once ---------- */
function trialEnd() {
  if (!S.onboard || !S.trial || S.trial.told || trialLeft() > 0 || payActive()) return;
  S.trial.told = 1; save(); track('trial_end');
  const q = Math.max(0, totalQ() - (S.trial.q || 0));
  if (cur()[0] === 'quiz') return;
  render();
  setTimeout(() => modal('<h3>★ Your free Pro day is over</h3>' + (q ? '<p>You practised <b>' + q + ' questions</b> in it.</p>' : '') + '<p>Keep unlimited practice and full mocks for <b>Rs ' + EXAM.plans[0].p + ' a week</b> — about Rs ' + Math.round(EXAM.plans[0].p / 7) + ' a day.</p><button class="btn gold big" data-act="keepPro2">Keep Pro</button><button class="btn ghost big" data-act="close">Not now</button>'), 400);
}
ACT.keepPro2 = () => { closeModal(); ACT.keepPro(); };

/* ---------- start ---------- */
function boot() {
  render(); loadCfg().then(() => { if (S.onboard) track('open'); passCheck(); });
  setTimeout(trialEnd, 2500); setInterval(() => { if (!document.hidden) { trialEnd(); passCheck(); } }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(trialEnd, 1000); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
}
boot();
</script></body></html>
