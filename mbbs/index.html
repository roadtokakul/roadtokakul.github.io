<style>/* The exam apps' look: Road to Kakul's family — dark, brass and green. */
@font-face{font-family:"InterV";src:url("../fonts/inter.woff2") format("woff2");font-weight:100 900;font-display:swap}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{background:radial-gradient(900px 420px at 50% -180px,var(--hero1) 0%,transparent 72%),var(--bg);min-height:100vh}
#app{max-width:560px;margin:0 auto;padding-bottom:92px}#app.nonav{padding-bottom:28px}
main{padding:10px 14px 4px}main.enter{animation:enter .24s var(--ease) both}@keyframes enter{from{opacity:0;transform:translateY(6px)}}
h1,h2,h3{margin:.2em 0 .45em;line-height:1.2;font-family:var(--fd);letter-spacing:.01em}h1{font-size:2rem}h2{font-size:1.35rem}h3{font-size:1.12rem}
p{margin:.4em 0 .7em}small{display:block;color:var(--mute);font-size:.8rem;line-height:1.35}.mute{color:var(--mute)}.fine{color:var(--mute);font-size:.76rem}.c,.center{text-align:center}
a{color:var(--gold2)}ul{padding-left:20px;margin:6px 0}li{margin:4px 0}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(6,9,8,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .hl,header .hr{display:flex;align-items:center;gap:10px}.ttl{font-family:var(--fd);font-size:1.25rem;letter-spacing:.02em}
.logo svg{width:30px;height:30px;display:block}.ib{background:none;border:0;color:var(--fg);padding:4px;cursor:pointer}.ib svg{width:24px;height:24px}
.chip{border:1px solid var(--line2);border-radius:99px;padding:3px 10px;font-size:.75rem;font-weight:700;color:var(--fg2);cursor:pointer;white-space:nowrap}
.chip.pro{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1b1405;border:0}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px}
.tap{cursor:pointer}.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.g{gap:10px}.wide{flex:1}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card2);color:var(--fg);border-radius:14px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.big{display:flex;width:100%;padding:14px;margin:8px 0 4px;font-size:1rem}.btn.sm{padding:6px 12px;font-size:.82rem;border-radius:10px}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1405;border:0;box-shadow:0 6px 18px rgba(217,180,95,.25)}
.btn.ghost{background:transparent}.btn:disabled{opacity:.45}
.pill{border-radius:99px;padding:2px 10px;background:rgba(63,191,116,.14);color:var(--ac2);font-weight:700;font-size:.82rem}

.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:0}
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px;border-radius:var(--r);margin-bottom:12px;background:linear-gradient(160deg,#17432c,#0b1a12);border:1px solid rgba(217,180,95,.25)}
.hero small{color:var(--fg2);letter-spacing:.06em}.big{font-family:var(--fd);font-size:3rem;line-height:1;margin:4px 0}.big span{font-size:1.3rem;color:var(--mute)}
.ring{--p:0;width:92px;height:92px;border-radius:50%;flex:none;display:grid;place-items:center;align-content:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.08) 0);position:relative}
.ring:before{content:"";position:absolute;inset:8px;border-radius:50%;background:#0d2117}.ring b,.ring small{position:relative}.ring b{font-family:var(--fd);font-size:1.7rem;line-height:1}.ring small{font-size:.62rem;letter-spacing:.12em}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.tile{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer}.tile b{display:block;margin-top:6px}
.trow{display:grid;grid-template-columns:1fr 38%;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.trow:last-child{border-bottom:0}.trow.off{opacity:.5}.trow .bar{margin:0}
.chev{color:var(--mute);font-size:1.4rem}.intro{color:var(--mute);margin:2px 2px 14px}

.trialc{border-color:rgba(217,180,95,.45)}.trialc .btn{margin-top:10px;display:flex;width:100%}
.callout{border-radius:14px;padding:12px 14px;margin-bottom:12px;border:1px solid var(--line2)}.callout.okc{background:rgba(63,191,116,.1);border-color:rgba(63,191,116,.35)}.callout.tip{background:rgba(217,180,95,.08);border-color:rgba(217,180,95,.35)}
.welcome{min-height:100vh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:28px 18px}.wl svg{width:84px;height:84px}
.tag{color:var(--gold2);font-weight:600;margin-top:0}.hook{font-weight:700;font-size:1.08rem;margin:14px 0 4px}.trialnote{color:var(--gold2);margin:4px 0 14px}
.feats{text-align:left;display:grid;gap:10px}.feats div{display:grid;grid-template-columns:auto 1fr;column-gap:2px}.feats small{grid-column:2}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.timer{font-family:var(--fd);font-size:1.2rem;color:var(--gold2)}.timer.low{color:var(--red)}

.sheet{background:#101914;border:1px solid var(--line2);border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:88vh;overflow:auto}

.lk{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;font-size:.66rem;font-weight:800;letter-spacing:.04em;vertical-align:1px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1b1405}

.qtools{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
.tl{border:1px solid var(--line2);background:transparent;color:var(--fg2);border-radius:99px;padding:5px 11px;font:inherit;font-size:.76rem;font-weight:600;cursor:pointer}
.tl.on{border-color:var(--gold);color:var(--gold2);background:rgba(217,180,95,.12)}
.grid button.fl{border-color:var(--gold2);box-shadow:inset 0 -3px 0 var(--gold)}
.papers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
.paper{border:1px solid var(--line2);background:var(--card2);color:var(--fg);border-radius:14px;padding:12px 6px;font:inherit;text-align:center;cursor:pointer}
.paper b{display:block;font-family:var(--fd);font-size:1rem}.paper small{font-size:.68rem;margin-top:2px}
.paper.done{border-color:rgba(63,191,116,.55);background:rgba(63,191,116,.1)}.paper.done small{color:var(--ac2)}

  background:linear-gradient(160deg,#17432c,#0b1a12);border:1px solid rgba(217,180,95,.3)}
.fcard .q{font-size:1.15rem}.fcard.flip{border-color:var(--gold)}
.fcard .ans{border-top:1px solid var(--line2);padding-top:12px}.fcard .ans b{display:block;font-size:1.15rem;color:var(--gold2)}.fcard .ans small{margin-top:6px;color:var(--fg2)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.rate .btn{padding:12px 4px;font-size:.86rem}
ul.notes{padding-left:18px;margin:4px 0}ul.notes li{margin:8px 0;color:var(--fg2);line-height:1.5}ul.notes li::marker{color:var(--gold)}
.frow{padding:10px 0;border-bottom:1px solid var(--line)}.frow:last-child{border-bottom:0}.frow b{display:block;margin:2px 0 6px}
.frow code{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92rem;color:var(--gold2);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
.qa{padding:10px 0;border-bottom:1px solid var(--line)}.qa:last-child{border-bottom:0}.qa p{margin:.3em 0 0;color:var(--fg2)}
.agv{font-family:var(--fd);font-size:1.5rem;color:var(--gold2)}
.upsell{background:linear-gradient(160deg,rgba(217,180,95,.12),transparent 60%),var(--card)}.upsell.tap:active{transform:scale(.99)}
@media (max-width:380px){.papers{grid-template-columns:repeat(3,1fr)}.rate .btn{font-size:.78rem}}

const NOTES = {
  // ---------- Biology ----------
  b_mol: ['Carbohydrates: Cₙ(H₂O)ₙ. Monosaccharides (glucose, fructose, galactose) join by glycosidic bonds into disaccharides (maltose, sucrose, lactose) and polysaccharides (starch, glycogen, cellulose).',

  b_enz: ['Enzymes are mostly globular proteins that lower activation energy; they are not used up.',

  b_cell: ['Cell theory: all living things are made of cells; the cell is the unit of life; cells come from pre-existing cells.',

  b_acell: ['Viruses are acellular: a nucleic acid core (DNA or RNA, never both) inside a protein coat (capsid); some have an envelope.',

  b_circ: ['Human heart: 4 chambers, double circulation. Right side → lungs (pulmonary); left side → body (systemic). The left ventricle has the thickest wall.',

  b_imm: ['First line: skin, mucus, tears (lysozyme), stomach acid. Second line: inflammation, fever, phagocytes (neutrophils, macrophages).',

  b_homeo: ['Homeostasis keeps the internal environment steady: temperature, water, glucose, pH.',

  c_carb: ['Carboxylic acids have –COOH; they are weak acids that turn blue litmus red and fizz with NaHCO₃ (CO₂).',

    'Adverbs describe verbs: she sings well (not good).'],
  // ---------- Logical Reasoning ----------

    'Correlation is not causation: two things happening together does not prove one causes the other.',

  l_series: ['Check the differences between terms first; then check the differences of the differences.',

  l_deduct: ['Assume the statements are true, even if they sound odd.',

    'Draw circles (Venn diagrams) to check a conclusion.'],

  l_action: ['A course of action follows if it is practical, tackles the problem and is not extreme.',

  l_cause: ['Ask: did A happen first and make B happen? Then A is the cause.',

    'If there is no sensible link, they are independent.',
    'A cause comes before its effect in time.',
    'Watch the order: the effect can be written first.',
    'Prices, floods, diseases and closures usually have a clear chain of cause.']

// a fact table: { t, q: 'stem with {a}', r: 'reverse stem with {b}', e: 'why, with {a} {b}', x: [[a, b], ...] }.
// Wrong answers come from the same table and never share the right answer, so every question has one correct option.
// inside a sentence a leading article is lower case ("What is a capsid?"); at the start it keeps its capital
const art = v => String(v).replace(/^(A|An|The) /, m => m.toLowerCase());

function fresh(t, n) {           // generated questions for a topic (numbers change every time)

// pick n questions from a topic: unseen first, then the longest ago; generated ones mixed in
function pickTopic(t, n) {
  // a fixed paper (sample papers, the daily challenge) is drawn from the whole bank so it is the same on every phone;
  // a question this phone reported is then swapped for the next one in the same fixed order
  const pool = FIXED ? ALL.filter(q => q.t === t) : (byTopic[t] || []).slice();
  if (FIXED) { const order = shuffle(pool).filter(q => !S.hidden[q.id] && !HIDE[q.id]), share = GENS[t] ? Math.min(n, Math.max(Math.ceil(n / 4), n - pool.length)) : 0;
    return shuffle(order.slice(0, Math.max(0, n - share)).concat(fresh(t, share))).slice(0, n); }

  const share = GENS[t] ? Math.min(n, Math.max(Math.ceil(n / 4), n - pool.length)) : 0;

// pick n questions for a subject, spread over its topics (in proportion to how many questions each has)
function pickSubject(s, n, only) {
  const ts = SUBJ[s].topics.map(x => x[0]).filter(t => hasQ(t) && (!only || only.includes(t))); if (!ts.length) return [];
  const w = ts.map(t => Math.max(8, Math.sqrt(topicCount(t) + 1) * 4)), W = w.reduce((a, b) => a + b, 0);
  const per = {}; let k = 0; ts.forEach((t, i) => { per[t] = Math.floor(n * w[i] / W); k += per[t]; });
  while (k < n) { per[ts[rnd(ts.length)]]++; k++; }
  const out = []; Object.keys(per).forEach(t => { if (per[t]) out.push(...pickTopic(t, per[t])); });

}

function paper(scale, only) {

// flashcards: a simple spaced-repetition schedule (again: 1 day, good: ×2.5, easy: ×3.5)
const CARD_NEW_FREE = 20, CARD_NEW_PRO = 60;
function cardDay() { if (!S.cardDay || S.cardDay.d !== today()) S.cardDay = { d: today(), n: 0 }; return S.cardDay; }
const newCardsLeft = () => Math.max(0, (isPro() ? CARD_NEW_PRO : CARD_NEW_FREE) - cardDay().n);
const dueCards = t => CARDS.filter(c => S.cards[c.id] && S.cards[c.id].due <= today() && (!t || c.t === t));
let CD = null;
ACT.cards = t => {
  const due = shuffle(dueCards(t)).slice(0, 40), fresh_ = shuffle(CARDS.filter(c => !S.cards[c.id] && (!t || c.t === t))).slice(0, newCardsLeft());
  const list = due.concat(fresh_);
  if (!list.length) { if (!isPro() && !newCardsLeft()) proSheet('cards'); else toast('All caught up — come back tomorrow'); return; }
  CD = { list, i: 0, flip: false, t }; go('card');
};
V.card = () => {
  if (!CD || CD.i >= CD.list.length) return { title: 'Flashcards', noNav: true, html: '<div class="card center"><h3>Done for now ✓</h3><p class="mute">' + dueCards().length + ' due later today.</p><button class="btn gold big" data-act="home">Home</button></div>' };
  const c = CD.list[CD.i];
  return { title: 'Flashcards · ' + (CD.i + 1) + '/' + CD.list.length, noNav: true, html: '<div class="fcard' + (CD.flip ? ' flip' : '') + '" data-act="flipCard"><small>' + esc(SUBJ[c.s].n + ' · ' + TOPIC[c.t].n) + '</small><p class="q">' + esc(c.f) + '</p>' +
    (CD.flip ? '<div class="ans"><b>' + esc(c.b) + '</b>' + (c.e && c.e !== c.b ? '<small>' + esc(c.e) + '</small>' : '') + '</div>' : '<small class="mute">Tap to see the answer</small>') + '</div>' +
    (CD.flip ? '<div class="rate"><button class="btn" data-act="rate" data-arg="0">Again</button><button class="btn" data-act="rate" data-arg="1">Hard</button><button class="btn gold" data-act="rate" data-arg="2">Good</button><button class="btn" data-act="rate" data-arg="3">Easy</button></div>' : '') };
};
ACT.flipCard = () => { if (CD) { CD.flip = true; render(); } };
ACT.rate = g => {
  const c = CD.list[CD.i], st = S.cards[c.id] || { iv: 0, ef: 2.5 }; g = +g;
  if (!S.cards[c.id]) cardDay().n++;
  if (g === 0) { st.iv = 0; st.ef = Math.max(1.3, st.ef - .2); } else { st.iv = st.iv ? Math.round(st.iv * (g === 1 ? 1.2 : g === 2 ? st.ef : st.ef * 1.4)) : (g === 1 ? 1 : g === 2 ? 2 : 4); st.ef = Math.max(1.3, st.ef + (g === 3 ? .15 : g === 1 ? -.15 : 0)); }
  st.due = pkDay(Date.now() + Math.max(st.iv, g === 0 ? 0 : 1) * 864e5); S.cards[c.id] = st;
  if (g === 0) CD.list.push(c);
  CD.i++; CD.flip = false; save(); render();
};

// a declined or blocked ID is switched off within the hour
function passCheck() {
  if (!apiOn() || !S.pay || !S.pay.tid || S.pay.off) return;
  if (S.passChk && Date.now() - S.passChk < 3600e3) return; S.passChk = Date.now(); save();
  apiCall('/pass/check?tid=' + encodeURIComponent(S.pay.tid) + '&dev=' + encodeURIComponent(S.dev)).then(o => {
    if (o && (o.pass === 'declined' || o.pass === 'blocked')) { S.pay.off = 1; save(); render(); toast('Your Transaction ID was not found — the pass is off'); }
  }).catch(() => { });
}

/* ---------- the free Pro day ends: once ---------- */
function trialEnd() {
  if (!S.onboard || !S.trial || S.trial.told || trialLeft() > 0 || payActive()) return;
  if (cur()[0] === 'quiz' || cur()[0] === 'card') return;
  S.trial.told = 1; save(); track('trial_end');
  const q = Math.max(0, totalQ() - (S.trial.q || 0));
  render();
  setTimeout(() => modal('<h3>★ Your free Pro day is over</h3>' + (q ? '<p>You practised <b>' + q + ' questions</b> in it.</p>' : '') + '<p>Keep every test, sample paper and flashcard for <b>Rs ' + EXAM.plans[0].p + ' a week</b> — about Rs ' + Math.round(EXAM.plans[0].p / 7) + ' a day.</p><button class="btn gold big" data-act="keepPro2">Keep Pro</button><button class="btn ghost big" data-act="close">Not now</button>'), 400);
}
ACT.keepPro2 = () => { closeModal(); ACT.keepPro(); };

/* ---------- start ---------- */
function boot() {
  if (S.v < 2) { S = Object.assign(defState(), S, { v: 2 }); save(); }
  render(); loadExtra(); loadCfg().then(() => { if (S.onboard) track('open'); passCheck(); });
  setTimeout(trialEnd, 2500); setInterval(() => { if (!document.hidden) { trialEnd(); passCheck(); } }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(trialEnd, 1000); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
}
boot();
</script></body></html>
